name: tests
'on':
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the linter
      run: pip install ruff
    - name: Build
      run: make build
    - name: Lint
      run: make lint
    - name: Run the suite
      run: make test
